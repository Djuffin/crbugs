[package]
name = "crbugs"
version = "0.2.0"
edition = "2021"
description = "CLI utility to fetch Chromium issues (issues.chromium.org) and attachments into Markdown or JSON"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.10"
sanitize-filename = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["gzip"] }

[dev-dependencies]
tempfile = "3.10"

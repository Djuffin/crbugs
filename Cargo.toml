[package]
name = "crbugs"
version = "0.1.0"
edition = "2021"
description = "CLI utility to fetch Chromium issues (issues.chromium.org) and attachments into Markdown or JSON"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
sanitize-filename = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.10"
